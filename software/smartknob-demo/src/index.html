<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <link rel="icon" href="data:," />
    <title>SmartKnob Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="#haptics">SmartKnob Demo</a>
      <nav aria-label="デモ">
        <button data-mode="haptics" class="active">ハプティクス</button
        ><button data-mode="os">OS Demo</button>
      </nav>
      <div class="connection">
        <button id="connect">USBで接続</button
        ><button id="disconnect" hidden>切断</button>
      </div>
    </header>
    <main>
      <div id="notice" role="status" aria-live="polite"></div>
      <div id="haptics">
        <div class="intro">
          <h1>ハプティクスデモ</h1>
          <p>
            8種類のプリセットをノブで試せます。<span class="keyboard-hint"
              >数字キー 1–8 で切り替え</span
            >
          </p>
        </div>
        <div class="studio">
          <div
            id="presets"
            class="preset-list"
            aria-label="感触のプリセット"
          ></div>
          <div class="dial-area">
            <svg
              id="dial"
              viewBox="0 0 440 440"
              role="img"
              aria-label="ノブの現在位置"
            ></svg>
          </div>
          <article class="explanation">
            <h2 id="preset-name">粗い</h2>
            <p id="tag" class="tag"></p>
            <div id="variants" class="variants" aria-label="感触の比較"></div>
            <div class="parameters">
              <div>
                <strong id="angle"></strong><span>1ステップの角度</span>
              </div>
              <div><strong id="unit"></strong><span id="caption"></span></div>
            </div>
            <div class="wave-heading">
              <p class="small">抵抗とヒステリシス</p>
              <output id="wave-position">0.00</output>
            </div>
            <svg
              id="wave"
              viewBox="0 0 360 160"
              role="img"
              aria-label="抵抗の概念図"
            ></svg>
            <div class="wave-legend">
              <span>橙 実線：右へ</span><span>青 破線：左へ</span
              ><span>黒：現在位置</span>
            </div>
            <p class="help">位置による復元力の概念図。実測値ではありません。</p>
            <p id="description" class="description"></p>
          </article>
        </div>
        <div class="preview-row">
          <label for="preview">ドラッグして動きをプレビュー</label
          ><input
            id="preview"
            type="range"
            min="-24"
            max="24"
            step="0.01"
            value="0"
          /><button id="reset-preview" class="small-button">中央に戻す</button
          ><span id="preview-note">USB未接続 · 画面上のシミュレーション</span>
        </div>
      </div>
      <section id="os" hidden aria-label="OS Demo">
        <div id="desktop-host"></div>
      </section>
      <footer>
        <span id="status">未接続</span
        ><span>接続中はこのタブを開いたままにしてください。</span>
      </footer>
    </main>
    <script src="controller.js"></script>
  </body>
</html>
